name: Photos build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: photos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-check:
    name: Web check
    if: ${{ github.repository_owner != 'immich-app' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK
        run: mise run //:sdk:install && mise run //:sdk:build

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Svelte and TypeScript check
        run: pnpm run check:svelte && pnpm run check:typescript

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm run format

  server:
    name: Server image
    if: ${{ github.repository_owner != 'immich-app' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/photos-server" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            DEVICE=cpu
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:commit-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Android APK
    if: ${{ github.repository_owner != 'immich-app' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: ./mobile

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Signing key
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        working-directory: ./mobile
        run: |
          if [ -n "$KEY_JKS" ]; then printf "%s" "$KEY_JKS" | base64 -d > android/key.jks; fi

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Codegen
        run: mise //mobile:codegen

      - name: Build APK
        working-directory: ./mobile
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: photos-android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
